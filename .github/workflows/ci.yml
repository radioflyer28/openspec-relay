name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portability:
    name: Portability (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout OpenSpec GSD
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: openspec-guardrails
          persist-credentials: false

      - name: Checkout maintained OpenSpec fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: radioflyer28/OpenSpec
          ref: main
          path: OpenSpec
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20.19.0'

      - name: Install companion dependencies
        working-directory: openspec-guardrails
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Type-check and lint
        working-directory: openspec-guardrails
        run: pnpm typecheck && pnpm lint

      - name: Run automated portability suite
        working-directory: openspec-guardrails
        run: pnpm test

      - name: Verify canonical generated resources
        working-directory: openspec-guardrails
        run: git diff --exit-code -- pi workflows/discuss.generated.md

  portability-required:
    name: Automated portability passed
    runs-on: ubuntu-latest
    needs: [portability]
    if: always()
    steps:
      - name: Verify matrix
        run: test "${{ needs.portability.result }}" = success
